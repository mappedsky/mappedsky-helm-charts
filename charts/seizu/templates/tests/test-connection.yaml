apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "seizu.fullname" . }}-test-connection"
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
      args:
        - -qO-
        - http://{{ include "seizu.fullname" . }}:{{ .Values.service.port }}/healthcheck
