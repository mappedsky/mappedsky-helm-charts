{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seizu.secretName" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if or (compact (values .Values.secrets.data)) (compact (values .Values.secrets.extraData)) }}
stringData:
  {{- with .Values.secrets.data.neo4jUser }}
  NEO4J_USER: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.neo4jPassword }}
  NEO4J_PASSWORD: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.reportQuerySigningSecret }}
  REPORT_QUERY_SIGNING_SECRET: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.sessionTokenEncryptionKey }}
  SESSION_TOKEN_ENCRYPTION_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.sqlDatabaseUser }}
  SQL_DATABASE_USER: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.sqlDatabasePassword }}
  SQL_DATABASE_PASSWORD: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.chatCheckpointDatabaseUser }}
  CHAT_CHECKPOINT_DATABASE_USER: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.chatCheckpointDatabasePassword }}
  CHAT_CHECKPOINT_DATABASE_PASSWORD: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.chatLlmApiKey }}
  CHAT_LLM_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.openaiApiKey }}
  OPENAI_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.geminiApiKey }}
  GEMINI_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.googleApiKey }}
  GOOGLE_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.sandboxApiKey }}
  SANDBOX_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.sandboxAgentApiKey }}
  SANDBOX_AGENT_API_KEY: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.remediationGithubToken }}
  REMEDIATION_GITHUB_TOKEN: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.secrets.data.telemetryOtlpHeaders }}
  TELEMETRY_OTLP_HEADERS: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.extraData }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: {{ include "seizu.envValue" $value }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
