{{- if and .Values.cartographyWorker.enabled .Values.cartographyWorker.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seizu.cartographyWorkerSecretName" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
    app.kubernetes.io/component: cartography-worker
  {{- with .Values.cartographyWorker.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if compact (values .Values.cartographyWorker.secrets.data) }}
stringData:
  {{- range $name, $value := .Values.cartographyWorker.secrets.data }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: {{ include "seizu.envValue" $value }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
