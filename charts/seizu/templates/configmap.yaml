  RBAC_ROLE_CLAIM: {{ include "seizu.envValue" .Values.seizu.rbac.roleClaim }}
  RBAC_DEFAULT_ROLE: {{ include "seizu.envValue" .Values.seizu.rbac.defaultRole }}
  STATSD_HOST: {{ include "seizu.envValue" .Values.seizu.statsd.host }}
  STATSD_PORT: {{ include "seizu.envValue" .Values.seizu.statsd.port }}
  STATSD_CONSTANT_TAGS: {{ join "," .Values.seizu.statsd.constantTags | quote }}
  TELEMETRY_ENABLED: {{ include "seizu.envValue" .Values.seizu.telemetry.enabled }}
  TELEMETRY_OTLP_ENDPOINT: {{ include "seizu.envValue" .Values.seizu.telemetry.otlpEndpoint }}
  TELEMETRY_SERVICE_NAME: {{ include "seizu.envValue" .Values.seizu.telemetry.serviceName }}
  TELEMETRY_RECORD_CONTENT: {{ include "seizu.envValue" .Values.seizu.telemetry.recordContent }}
  MCP_ENABLED: {{ include "seizu.envValue" .Values.seizu.mcp.enabled }}
