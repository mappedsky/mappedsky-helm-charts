  OIDC_REFRESH_TOKEN_FALLBACK_TTL_SECONDS: {{ include "seizu.envValue" .Values.seizu.auth.oidcRefreshTokenFallbackTtlSeconds }}
  NEO4J_URI: {{ include "seizu.envValue" .Values.seizu.neo4j.uri }}
  {{- /* OFF is a documented severity, but YAML 1.1 parses it as a boolean, so
         an operator writing the documented value unquoted would otherwise send
         "false". Map the bool back to the literal they typed. */}}
  {{- $severity := .Values.seizu.neo4j.notificationsMinSeverity }}
  {{- if kindIs "bool" $severity }}{{ $severity = ternary "ON" "OFF" $severity }}{{ end }}
  NEO4J_NOTIFICATIONS_MIN_SEVERITY: {{ include "seizu.envValue" $severity }}
  NEO4J_MAX_CONNECTION_LIFETIME: {{ include "seizu.envValue" .Values.seizu.neo4j.maxConnectionLifetime }}
  NEO4J_CONNECTION_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.neo4j.connectionTimeout }}
  NEO4J_QUERY_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.neo4j.queryTimeout }}
  GRAPH_SCHEMA_CACHE_TTL_SECONDS: {{ include "seizu.envValue" .Values.seizu.neo4j.schemaCacheTtlSeconds }}
  QUERY_VALIDATOR_ALLOWED_PROCEDURES: {{ join "," .Values.seizu.queryValidator.allowedProcedures | quote }}
