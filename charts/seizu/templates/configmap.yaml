apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seizu.configMapName" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
data:
  DEBUG: {{ include "seizu.envValue" .Values.seizu.debug }}
  HOST: {{ include "seizu.envValue" .Values.seizu.host }}
  PORT: {{ include "seizu.envValue" .Values.seizu.port }}
  {{- with .Values.seizu.staticFolder }}
  STATIC_FOLDER: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.seizu.logConfigFile }}
  LOG_CONFIG_FILE: {{ include "seizu.envValue" . }}
  {{- end }}
  TALISMAN_FORCE_HTTPS: {{ include "seizu.envValue" .Values.seizu.talismanForceHttps }}
  API_REQUEST_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.apiRequestTimeout }}
  JWKS_FETCH_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.jwksFetchTimeout }}
  AWS_CONNECT_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.awsConnectTimeout }}
  AWS_READ_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.awsReadTimeout }}
  SQL_STATEMENT_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.sqlStatementTimeout }}
  SLACK_TIMEOUT: {{ include "seizu.envValue" .Values.seizu.slackTimeout }}
  SEIZU_PUBLIC_URL: {{ include "seizu.envValue" .Values.seizu.publicUrl }}
  SEIZU_DEPLOYMENT_ID: {{ include "seizu.envValue" .Values.seizu.deploymentId }}
  ACTION_CONFIRMATION_TTL_SECONDS: {{ include "seizu.envValue" .Values.seizu.actionConfirmationTtlSeconds }}
  DEVELOPMENT_ONLY_REQUIRE_AUTH: {{ include "seizu.envValue" .Values.seizu.auth.developmentOnlyRequireAuth }}
  DEVELOPMENT_ONLY_AUTH_USER_EMAIL: {{ include "seizu.envValue" .Values.seizu.auth.developmentOnlyAuthUserEmail }}
  JWKS_URL: {{ include "seizu.envValue" .Values.seizu.auth.jwksUrl }}
  ALLOWED_JWT_ALGORITHMS: {{ join "," .Values.seizu.auth.allowedJwtAlgorithms | quote }}
  JWT_HEADER_NAME: {{ include "seizu.envValue" .Values.seizu.auth.jwtHeaderName }}
  JWT_EMAIL_CLAIM: {{ include "seizu.envValue" .Values.seizu.auth.jwtEmailClaim }}
  JWT_USERNAME_CLAIM: {{ include "seizu.envValue" .Values.seizu.auth.jwtUsernameClaim }}
  JWT_SUB_CLAIM: {{ include "seizu.envValue" .Values.seizu.auth.jwtSubClaim }}
  JWT_ISS_CLAIM: {{ include "seizu.envValue" .Values.seizu.auth.jwtIssClaim }}
  JWT_ISSUER: {{ include "seizu.envValue" .Values.seizu.auth.jwtIssuer }}
  JWT_AUDIENCE: {{ include "seizu.envValue" .Values.seizu.auth.jwtAudience }}
