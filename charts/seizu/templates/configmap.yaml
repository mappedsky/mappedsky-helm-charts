apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seizu.configMapName" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
data:
  HOST: {{ .Values.seizu.host | quote }}
  PORT: {{ .Values.seizu.port | quote }}
  {{- with .Values.seizu.staticFolder }}
  STATIC_FOLDER: {{ . | quote }}
  {{- end }}
  {{- with .Values.seizu.logConfigFile }}
  LOG_CONFIG_FILE: {{ . | quote }}
  {{- end }}
  TALISMAN_FORCE_HTTPS: {{ .Values.seizu.talismanForceHttps | quote }}
  API_REQUEST_TIMEOUT: {{ .Values.seizu.apiRequestTimeout | quote }}
  SEIZU_PUBLIC_URL: {{ .Values.seizu.publicUrl | quote }}
  ACTION_CONFIRMATION_TTL_SECONDS: {{ .Values.seizu.actionConfirmationTtlSeconds | quote }}
  DEVELOPMENT_ONLY_REQUIRE_AUTH: {{ .Values.seizu.auth.developmentOnlyRequireAuth | quote }}
  DEVELOPMENT_ONLY_AUTH_USER_EMAIL: {{ .Values.seizu.auth.developmentOnlyAuthUserEmail | quote }}
  JWKS_URL: {{ .Values.seizu.auth.jwksUrl | quote }}
  ALLOWED_JWT_ALGORITHMS: {{ join "," .Values.seizu.auth.allowedJwtAlgorithms | quote }}
  JWT_HEADER_NAME: {{ .Values.seizu.auth.jwtHeaderName | quote }}
  JWT_EMAIL_CLAIM: {{ .Values.seizu.auth.jwtEmailClaim | quote }}
  JWT_USERNAME_CLAIM: {{ .Values.seizu.auth.jwtUsernameClaim | quote }}
  JWT_SUB_CLAIM: {{ .Values.seizu.auth.jwtSubClaim | quote }}
  JWT_ISS_CLAIM: {{ .Values.seizu.auth.jwtIssClaim | quote }}
  JWT_ISSUER: {{ .Values.seizu.auth.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.seizu.auth.jwtAudience | quote }}
  OIDC_AUTHORITY: {{ .Values.seizu.auth.oidcAuthority | quote }}
  OIDC_INTERNAL_AUTHORITY: {{ .Values.seizu.auth.oidcInternalAuthority | quote }}
  OIDC_CLIENT_ID: {{ .Values.seizu.auth.oidcClientId | quote }}
  OIDC_TOKEN_ENDPOINT_AUTH_METHOD: {{ .Values.seizu.auth.oidcTokenEndpointAuthMethod | quote }}
  OIDC_REDIRECT_URI: {{ .Values.seizu.auth.oidcRedirectUri | quote }}
  OIDC_SCOPE: {{ .Values.seizu.auth.oidcScope | quote }}
  OIDC_AUTHORIZE_EXTRA_PARAMS: {{ .Values.seizu.auth.oidcAuthorizeExtraParams | quote }}
  OIDC_ENABLE_TOKEN_INTROSPECTION: {{ .Values.seizu.auth.oidcEnableTokenIntrospection | quote }}
  OIDC_VALIDATE_ID_TOKEN: {{ .Values.seizu.auth.oidcValidateIdToken | quote }}
  NEO4J_URI: {{ .Values.seizu.neo4j.uri | quote }}
  NEO4J_NOTIFICATIONS_MIN_SEVERITY: {{ .Values.seizu.neo4j.notificationsMinSeverity | quote }}
  NEO4J_MAX_CONNECTION_LIFETIME: {{ .Values.seizu.neo4j.maxConnectionLifetime | quote }}
  NEO4J_CONNECTION_TIMEOUT: {{ .Values.seizu.neo4j.connectionTimeout | quote }}
  NEO4J_QUERY_TIMEOUT: {{ .Values.seizu.neo4j.queryTimeout | quote }}
  QUERY_VALIDATOR_ALLOWED_PROCEDURES: {{ join "," .Values.seizu.queryValidator.allowedProcedures | quote }}
  REPORT_STORE_BACKEND: {{ .Values.seizu.reportStore.backend | quote }}
  DYNAMODB_TABLE_NAME: {{ .Values.seizu.reportStore.dynamodb.tableName | quote }}
  DYNAMODB_REGION: {{ .Values.seizu.reportStore.dynamodb.region | quote }}
  DYNAMODB_ENDPOINT_URL: {{ .Values.seizu.reportStore.dynamodb.endpointUrl | quote }}
  DYNAMODB_CREATE_TABLE: {{ .Values.seizu.reportStore.dynamodb.createTable | quote }}
  SQL_DATABASE_URL: {{ .Values.seizu.reportStore.sqlDatabaseUrl | quote }}
  RBAC_ROLE_CLAIM: {{ .Values.seizu.rbac.roleClaim | quote }}
  RBAC_DEFAULT_ROLE: {{ .Values.seizu.rbac.defaultRole | quote }}
  MCP_ENABLED: {{ .Values.seizu.mcp.enabled | quote }}
  MCP_ENABLED_BUILTINS: {{ join "," .Values.seizu.mcp.enabledBuiltins | quote }}
  MCP_OAUTH_ISSUER: {{ .Values.seizu.mcp.oauthIssuer | quote }}
  MCP_OAUTH_AUTHORIZATION_ENDPOINT: {{ .Values.seizu.mcp.oauthAuthorizationEndpoint | quote }}
  MCP_OAUTH_TOKEN_ENDPOINT: {{ .Values.seizu.mcp.oauthTokenEndpoint | quote }}
  MCP_RESOURCE_URL: {{ .Values.seizu.mcp.resourceUrl | quote }}
  MCP_OAUTH_REGISTRATION_ENDPOINT: {{ .Values.seizu.mcp.oauthRegistrationEndpoint | quote }}
  ENABLE_SCHEDULED_QUERIES: {{ .Values.scheduledQueries.enabled | quote }}
  SCHEDULED_QUERY_FREQUENCY: {{ .Values.scheduledQueries.frequency | quote }}
  SCHEDULED_QUERY_MODULES: {{ join "," .Values.scheduledQueries.modules | quote }}
  CHAT_ENABLED: {{ .Values.seizu.chat.enabled | quote }}
  CHAT_LLM_PROVIDER: {{ .Values.seizu.chat.llm.provider | quote }}
  CHAT_LLM_MODEL: {{ .Values.seizu.chat.llm.model | quote }}
  CHAT_LLM_BASE_URL: {{ .Values.seizu.chat.llm.baseUrl | quote }}
  CHAT_LLM_TEMPERATURE: {{ .Values.seizu.chat.llm.temperature | quote }}
  CHAT_LLM_MAX_TOKENS: {{ .Values.seizu.chat.llm.maxTokens | quote }}
  CHAT_LLM_TIMEOUT_SECONDS: {{ .Values.seizu.chat.llm.timeoutSeconds | quote }}
  CHAT_LLM_MAX_RETRIES: {{ .Values.seizu.chat.llm.maxRetries | quote }}
  CHAT_LLM_MAX_CONTINUATIONS: {{ .Values.seizu.chat.llm.maxContinuations | quote }}
  CHAT_LLM_MAX_RESPONSE_CHARS: {{ .Values.seizu.chat.llm.maxResponseChars | quote }}
  CHAT_LLM_CONTEXT_MAX_MESSAGES: {{ .Values.seizu.chat.llm.contextMaxMessages | quote }}
  CHAT_LLM_CONTEXT_MAX_CHARS: {{ .Values.seizu.chat.llm.contextMaxChars | quote }}
  CHAT_LLM_SYSTEM_PROMPT: {{ .Values.seizu.chat.llm.systemPrompt | quote }}
  CHAT_LLM_PROGRESSIVE_DISCLOSURE: {{ .Values.seizu.chat.llm.progressiveDisclosure | quote }}
  CHAT_LLM_MAX_AUTO_ACTIONS: {{ .Values.seizu.chat.llm.maxAutoActions | quote }}
  CHAT_LLM_MAX_PARALLEL_TOOL_CALLS: {{ .Values.seizu.chat.llm.maxParallelToolCalls | quote }}
  CHAT_LLM_PLANNER_MODEL: {{ .Values.seizu.chat.llm.plannerModel | quote }}
  CHAT_LLM_WORKER_MODEL: {{ .Values.seizu.chat.llm.workerModel | quote }}
  CHAT_LLM_VERIFIER_MODEL: {{ .Values.seizu.chat.llm.verifierModel | quote }}
  CHAT_LLM_SYNTHESIZER_MODEL: {{ .Values.seizu.chat.llm.synthesizerModel | quote }}
  CHAT_LLM_ECONOMY_MODEL: {{ .Values.seizu.chat.llm.economyModel | quote }}
  CHAT_ORCHESTRATOR_ENABLED: {{ .Values.seizu.chat.orchestrator.enabled | quote }}
  CHAT_ORCHESTRATOR_MAX_STEPS: {{ .Values.seizu.chat.orchestrator.maxSteps | quote }}
  CHAT_ORCHESTRATOR_PLANNER_MAX_TOKENS: {{ .Values.seizu.chat.orchestrator.plannerMaxTokens | quote }}
  CHAT_ORCHESTRATOR_MAX_ITERATIONS: {{ .Values.seizu.chat.orchestrator.maxIterations | quote }}
  CHAT_ORCHESTRATOR_MAX_PARALLEL: {{ .Values.seizu.chat.orchestrator.maxParallel | quote }}
  CHAT_ORCHESTRATOR_WORKER_MAX_ACTIONS: {{ .Values.seizu.chat.orchestrator.workerMaxActions | quote }}
  CHAT_RUN_TOKEN_BUDGET: {{ .Values.seizu.chat.run.tokenBudget | quote }}
  CHAT_RUN_COST_BUDGET_USD: {{ .Values.seizu.chat.run.costBudgetUsd | quote }}
  CHAT_RUN_RESERVE_PERCENT: {{ .Values.seizu.chat.run.reservePercent | quote }}
  CHAT_RUN_SOFT_LIMIT_PERCENT: {{ .Values.seizu.chat.run.softLimitPercent | quote }}
  CHAT_RUN_MAX_LLM_CALLS: {{ .Values.seizu.chat.run.maxLlmCalls | quote }}
  CHAT_CHECKPOINT_BACKEND: {{ .Values.seizu.chat.checkpoint.backend | quote }}
  CHAT_CHECKPOINT_DATABASE_URL: {{ .Values.seizu.chat.checkpoint.databaseUrl | quote }}
  CHAT_CHECKPOINT_DATABASE_POOL_MIN_SIZE: {{ .Values.seizu.chat.checkpoint.poolMinSize | quote }}
  CHAT_CHECKPOINT_DATABASE_POOL_MAX_SIZE: {{ .Values.seizu.chat.checkpoint.poolMaxSize | quote }}
  CHAT_CHECKPOINT_TABLE_NAME: {{ .Values.seizu.chat.checkpoint.tableName | quote }}
  CHAT_CHECKPOINT_CREATE_TABLE: {{ .Values.seizu.chat.checkpoint.createTable | quote }}
  CHAT_CHECKPOINT_TTL_SECONDS: {{ .Values.seizu.chat.checkpoint.ttlSeconds | quote }}
  CHAT_CHECKPOINT_ENABLE_COMPRESSION: {{ .Values.seizu.chat.checkpoint.enableCompression | quote }}
  CHAT_CHECKPOINT_S3_BUCKET: {{ .Values.seizu.chat.checkpoint.s3Bucket | quote }}
  CHAT_CHECKPOINT_S3_ENDPOINT_URL: {{ .Values.seizu.chat.checkpoint.s3EndpointUrl | quote }}
  CHAT_CHECKPOINT_S3_KEY_PREFIX: {{ .Values.seizu.chat.checkpoint.s3KeyPrefix | quote }}
  CHAT_MAX_PERSISTED_MESSAGES: {{ .Values.seizu.chat.maxPersistedMessages | quote }}
  CHAT_HISTORY_LIMIT: {{ .Values.seizu.chat.historyLimit | quote }}
  CHAT_TOOL_RESULT_MAX_ROWS: {{ .Values.seizu.chat.toolResultMaxRows | quote }}
  CHAT_TOOL_RESULT_MAX_BYTES: {{ .Values.seizu.chat.toolResultMaxBytes | quote }}
  CHAT_SCHEDULES_ENABLED: {{ .Values.scheduledChats.enabled | quote }}
  CHAT_SCHEDULES_POLL_SECONDS: {{ .Values.scheduledChats.pollSeconds | quote }}
  CHAT_SCHEDULE_TIMEOUT_SECONDS: {{ .Values.scheduledChats.timeoutSeconds | quote }}
  TEMPORAL_ADDRESS: {{ .Values.seizu.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.seizu.temporal.namespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.seizu.temporal.taskQueue | quote }}
  TEMPORAL_WORKER_ENABLED: {{ .Values.temporalWorker.enabled | quote }}
  TEMPORAL_WORKFLOW_MAX_RESULT_ROWS: {{ .Values.seizu.temporal.workflowMaxResultRows | quote }}
  TEMPORAL_ENABLED_WORKFLOWS: {{ join "," .Values.seizu.temporal.enabledWorkflows | quote }}
  TEMPORAL_CHAT_ACTIVITY_TIMEOUT_SECONDS: {{ .Values.seizu.temporal.chatActivityTimeoutSeconds | quote }}
  SANDBOX_ENABLED: {{ .Values.seizu.sandbox.enabled | quote }}
  SANDBOX_DOMAIN: {{ .Values.seizu.sandbox.domain | quote }}
  SANDBOX_ALLOW_INTERNET: {{ .Values.seizu.sandbox.allowInternet | quote }}
  SANDBOX_TIMEOUT_SECONDS: {{ .Values.seizu.sandbox.timeoutSeconds | quote }}
  SANDBOX_MAX_OUTPUT_BYTES: {{ .Values.seizu.sandbox.maxOutputBytes | quote }}
  SANDBOX_LLM_MODEL: {{ .Values.seizu.sandbox.llmModel | quote }}
  SANDBOX_AGENT_PROVIDER: {{ .Values.seizu.sandbox.agent.provider | quote }}
  SANDBOX_AGENT_TEMPLATE: {{ .Values.seizu.sandbox.agent.template | quote }}
  SANDBOX_AGENT_API_KEY_COMMAND: {{ .Values.seizu.sandbox.agent.apiKeyCommand | quote }}
  SANDBOX_AGENT_BASE_URL: {{ .Values.seizu.sandbox.agent.baseUrl | quote }}
  SANDBOX_AGENT_MODEL: {{ .Values.seizu.sandbox.agent.model | quote }}
  SANDBOX_AGENT_CREDENTIAL_PROXY_ENABLED: {{ .Values.seizu.sandbox.agent.credentialProxyEnabled | quote }}
  SANDBOX_AGENT_CREDENTIAL_PROXY_MAX_BUDGET: {{ .Values.seizu.sandbox.agent.credentialProxyMaxBudget | quote }}
  REMEDIATION_TIMEOUT_SECONDS: {{ .Values.seizu.remediation.timeoutSeconds | quote }}
  REMEDIATION_CI_MAX_WAIT_SECONDS: {{ .Values.seizu.remediation.ciMaxWaitSeconds | quote }}
  REMEDIATION_CI_POLL_SECONDS: {{ .Values.seizu.remediation.ciPollSeconds | quote }}
  REMEDIATION_CI_QUEUED_STUCK_SECONDS: {{ .Values.seizu.remediation.ciQueuedStuckSeconds | quote }}
  REMEDIATION_CI_FIX_MAX_ATTEMPTS: {{ .Values.seizu.remediation.ciFixMaxAttempts | quote }}
  REMEDIATION_GH_VERSION: {{ .Values.seizu.remediation.ghVersion | quote }}
  REMEDIATION_GH_SHA256: {{ .Values.seizu.remediation.ghSha256 | quote }}
  REMEDIATION_GITHUB_HOST: {{ .Values.seizu.remediation.githubHost | quote }}
  REMEDIATION_USE_FORK: {{ .Values.seizu.remediation.useFork | quote }}
  REMEDIATION_FORK_ORG: {{ .Values.seizu.remediation.forkOrg | quote }}
  REMEDIATION_GIT_USER: {{ .Values.seizu.remediation.gitUser | quote }}
  REMEDIATION_GIT_EMAIL: {{ .Values.seizu.remediation.gitEmail | quote }}
