  OIDC_INTERNAL_AUTHORITY: {{ include "seizu.envValue" .Values.seizu.auth.oidcInternalAuthority }}
  OIDC_REQUIRE_CONSISTENT_ISSUER: {{ include "seizu.envValue" .Values.seizu.auth.oidcRequireConsistentIssuer }}
  OIDC_CLIENT_ID: {{ include "seizu.envValue" .Values.seizu.auth.oidcClientId }}
  OIDC_TOKEN_ENDPOINT_AUTH_METHOD: {{ include "seizu.envValue" .Values.seizu.auth.oidcTokenEndpointAuthMethod }}
  {{- with .Values.seizu.auth.oidcRevocationEndpointAuthMethod }}
  OIDC_REVOCATION_ENDPOINT_AUTH_METHOD: {{ include "seizu.envValue" . }}
  {{- end }}
  {{- with .Values.seizu.auth.oidcIntrospectionEndpointAuthMethod }}
  OIDC_INTROSPECTION_ENDPOINT_AUTH_METHOD: {{ include "seizu.envValue" . }}
  {{- end }}
  OIDC_DISCOVERY_CACHE_TTL_SECONDS: {{ include "seizu.envValue" .Values.seizu.auth.oidcDiscoveryCacheTtlSeconds }}
  OIDC_REDIRECT_URI: {{ include "seizu.envValue" .Values.seizu.auth.oidcRedirectUri }}
  OIDC_SCOPE: {{ include "seizu.envValue" .Values.seizu.auth.oidcScope }}
  OIDC_AUTHORIZE_EXTRA_PARAMS: {{ include "seizu.envValue" .Values.seizu.auth.oidcAuthorizeExtraParams }}
  OIDC_ENABLE_TOKEN_INTROSPECTION: {{ include "seizu.envValue" .Values.seizu.auth.oidcEnableTokenIntrospection }}
  OIDC_VALIDATE_ID_TOKEN: {{ include "seizu.envValue" .Values.seizu.auth.oidcValidateIdToken }}
  SESSION_COOKIE_NAME: {{ include "seizu.envValue" .Values.seizu.auth.sessionCookieName }}
