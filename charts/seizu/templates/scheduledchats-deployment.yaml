{{- if .Values.scheduledChats.enabled }}
{{- if not .Values.seizu.chat.enabled }}
{{- fail "scheduledChats.enabled requires seizu.chat.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seizu.fullname" . }}-scheduled-chats
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduled-chats
spec:
  replicas: {{ .Values.scheduledChats.replicaCount }}
  selector:
    matchLabels:
      {{- include "seizu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduled-chats
  template:
    metadata:
      labels:
        {{- include "seizu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduled-chats
        {{- with .Values.scheduledChats.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.scheduledChats.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "seizu.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduled-chats
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "seizu.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.scheduledChats.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "seizu.configMapName" . }}
            {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ include "seizu.secretName" . }}
                optional: true
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.scheduledChats.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnv .Values.scheduledChats.extraEnv }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.scheduledChats.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.scheduledChats.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.runtimeDir.enabled }}
            - name: runtime-dir
              mountPath: {{ .Values.runtimeDir.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or .Values.runtimeDir.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.runtimeDir.enabled }}
        - name: runtime-dir
          emptyDir:
            {{- if .Values.runtimeDir.medium }}
            medium: {{ .Values.runtimeDir.medium | quote }}
            {{- end }}
            {{- if .Values.runtimeDir.sizeLimit }}
            sizeLimit: {{ .Values.runtimeDir.sizeLimit | quote }}
            {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
