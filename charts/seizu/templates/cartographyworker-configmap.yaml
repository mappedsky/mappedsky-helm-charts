{{- if .Values.cartographyWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seizu.cartographyWorkerConfigMapName" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
    app.kubernetes.io/component: cartography-worker
data:
  TEMPORAL_ADDRESS: {{ include "seizu.envValue" .Values.seizu.temporal.address }}
  TEMPORAL_NAMESPACE: {{ include "seizu.envValue" .Values.seizu.temporal.namespace }}
  CARTOGRAPHY_TASK_QUEUE: {{ include "seizu.envValue" .Values.seizu.cartography.taskQueue }}
  CARTOGRAPHY_ENABLED_MODULES: {{ join "," .Values.seizu.cartography.enabledModules | quote }}
  CARTOGRAPHY_NEO4J_URI: {{ include "seizu.envValue" (default .Values.seizu.neo4j.uri .Values.cartographyWorker.neo4jUri) }}
  {{- range $name, $value := .Values.cartographyWorker.config }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: {{ include "seizu.envValue" $value }}
  {{- end }}
  {{- end }}
{{- end }}
