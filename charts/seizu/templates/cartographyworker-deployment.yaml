{{- if .Values.cartographyWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seizu.cartographyWorkerFullname" . }}
  labels:
    {{- include "seizu.labels" . | nindent 4 }}
    app.kubernetes.io/component: cartography-worker
spec:
  replicas: {{ .Values.cartographyWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "seizu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cartography-worker
  template:
    metadata:
      labels:
        {{- include "seizu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cartography-worker
        {{- with .Values.cartographyWorker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/cartography-worker-config: {{ include (print $.Template.BasePath "/cartographyworker-configmap.yaml") . | sha256sum }}
        {{- if .Values.cartographyWorker.secrets.create }}
        checksum/cartography-worker-secret: {{ include (print $.Template.BasePath "/cartographyworker-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.cartographyWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "seizu.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cartographyWorker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cartography-worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "seizu.cartographyWorkerImage" . | quote }}
          imagePullPolicy: {{ .Values.cartographyWorker.image.pullPolicy }}
          {{- with .Values.cartographyWorker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "seizu.cartographyWorkerConfigMapName" . }}
            {{- if or .Values.cartographyWorker.secrets.create .Values.cartographyWorker.secrets.existingSecret }}
            - secretRef:
                name: {{ include "seizu.cartographyWorkerSecretName" . }}
                optional: true
            {{- end }}
            {{- with .Values.cartographyWorker.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cartographyWorker.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cartographyWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cartographyWorker.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.cartographyWorker.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cartographyWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cartographyWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cartographyWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cartographyWorker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
