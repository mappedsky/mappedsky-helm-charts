replicaCount: 1

image:
  repository: ghcr.io/mappedsky/seizu
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Empty uses the image's default entrypoint (the web service).
command: []
args: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

seizu:
  debug: false
  host: 0.0.0.0
  port: 8080
  staticFolder: ""
  logConfigFile: ""
  talismanForceHttps: true
  apiRequestTimeout: 60
  jwksFetchTimeout: 10
  awsConnectTimeout: 5
  awsReadTimeout: 30
  sqlStatementTimeout: 30
  slackTimeout: 30
  # Public browser origin used when MCP clients need to show a user an approval
  # URL. When unset, Seizu derives the origin from seizu.mcp.resourceUrl.
  publicUrl: ""
  # Maximum lifetime for an approved or denied mutating-action confirmation.
  actionConfirmationTtlSeconds: 1800
  # Tags every sandbox this installation creates, and is the only ownership
  # claim the sandbox reaper acts on. Set it whenever the sandbox credentials
  # are shared with another Seizu installation.
  deploymentId: ""
  auth:
    # Despite the name, this is the production setting: true requires
    # authentication, and the "developmentOnly" prefix means only a development
    # deployment should turn it OFF. Setting it false disables authentication
    # entirely and serves every request as developmentOnlyAuthUserEmail.
    #
    # With it on you must also configure a login path -- jwksUrl for bearer JWT
    # clients, oidcAuthority + oidcClientId for the browser flow -- and provide
    # secrets.data.reportQuerySigningSecret and
    # secrets.data.sessionTokenEncryptionKey. Those two are required lazily, so
    # a pod missing them starts healthy and fails on first use.
    developmentOnlyRequireAuth: true
    # Only used when developmentOnlyRequireAuth is false.
    developmentOnlyAuthUserEmail: testuser
    jwksUrl: ""
    allowedJwtAlgorithms:
      - RS256
      - ES256
      - ES512
    jwtHeaderName: Authorization
    jwtEmailClaim: email
    jwtUsernameClaim: preferred_username
    jwtSubClaim: sub
    jwtIssClaim: iss
    jwtIssuer: ""
    jwtAudience: ""
    oidcAuthority: ""
    oidcInternalAuthority: ""
    # Refuse to start when the internal and external authorities advertise
    # different issuers, instead of only logging the mismatch.
    oidcRequireConsistentIssuer: false
    oidcClientId: ""
    oidcTokenEndpointAuthMethod: none
    # Empty values inherit oidcTokenEndpointAuthMethod.
    oidcRevocationEndpointAuthMethod: ""
    oidcIntrospectionEndpointAuthMethod: ""
    oidcDiscoveryCacheTtlSeconds: 3600
    oidcRedirectUri: ""
    oidcScope: openid email offline_access
    oidcAuthorizeExtraParams: ""
    oidcEnableTokenIntrospection: false
    oidcValidateIdToken: true
    sessionCookieName: seizu_session
    sessionCookieMaxAgeSeconds: 64800
    oidcRevokeRefreshTokenOnLogout: true
    oidcRefreshTokenFallbackTtlSeconds: 2592000
  neo4j:
    uri: bolt://neo4j:7687
    # WARNING, INFORMATION, or OFF. Quote OFF -- unquoted, YAML reads it as a
    # boolean (the chart maps it back, but the quoted form is unambiguous).
    notificationsMinSeverity: WARNING
    maxConnectionLifetime: 3600
    connectionTimeout: 10
    queryTimeout: 30
    # Process-wide cache of the introspected graph schema; 0 disables caching.
    schemaCacheTtlSeconds: 300
  queryValidator:
    allowedProcedures: []
  # Application storage. Seizu 5 requires PostgreSQL; the DynamoDB backends and
  # the REPORT_STORE_BACKEND selector are gone, and startup refuses them.
  reportStore:
    # PostgreSQL URL for Seizu's application records. Keep credentials out of
    # this URL and provide them through secrets.data.sqlDatabaseUser /
    # secrets.data.sqlDatabasePassword.
    # Example: postgresql://postgres.default.svc.cluster.local:5432/seizu
    sqlDatabaseUrl: ""
  rbac:
    roleClaim: seizu_role
    defaultRole: seizu-viewer
  statsd:
    host: ""
    port: 8125
    constantTags: []
  # OTLP tracing of turns, plan steps, model calls and tool calls. Inert until
  # otlpEndpoint is set. Collector credentials go in
  # secrets.data.telemetryOtlpHeaders (comma-separated k=v pairs).
  telemetry:
    enabled: true
    otlpEndpoint: ""
    serviceName: seizu
    # Spans carry prompts, results and tool output. Off by default: those
    # contain graph rows and the user's own words.
    recordContent: false
  mcp:
    enabled: true
    enabledBuiltins: []
    oauthIssuer: ""
    oauthAuthorizationEndpoint: ""
    oauthTokenEndpoint: ""
    resourceUrl: ""
    oauthRegistrationEndpoint: ""
    # Bounds on a single non-chat MCP tool result. Far above the chat caps
    # (seizu.chat.toolResultMax*), which exist to protect a model's context.
    toolResultMaxRows: 50000
    toolResultMaxBytes: 25000000
    # Plan inspection for the generic graph__query tool. REST queries and
    # Cypher-backed toolset tools are unaffected. New in Seizu 5.1.0: a query
    # that used to run may now be rejected with query_plan_rejected. Must match
    # on the web service and the Temporal worker.
    graphQuery:
      rejectUnindexed: true
      # 0 rejects every non-index scan.
      unindexedMaxEstimatedRows: 100000
    # External MCP servers reached through an identity-aware proxy.
    external:
      enabled: false
      # JSON-serialized verbatim into MCP_EXTERNAL_PROXIES. Keys are the
      # upstream snake_case field names (name, url, upstream_urls, transport,
      # auth_mode, header_mappings, token_env, require_confirmation, enabled,
      # connect_timeout_seconds); unknown keys are rejected at startup.
      # A proxy's credential is named by token_env, never embedded here:
      # supply that variable through secrets.extraData or extraEnvFrom.
      proxies: []
      # How an Agent Plugin's mcp: dependency binds to a proxy:
      # "none" (ignore the package URL), "lax", or "strict".
      pluginUrlMatchMode: none
      # Cross-turn reuse of a proxy's discovered tool listing, per user.
      # 0 (default) disables the cache.
      discoveryTtlSeconds: 0
      # Fully namespaced external tools that always require confirmation.
      confirmationRequiredTools: []
      rateLimitRetries: 2
      rateLimitMaxWaitSeconds: 60
      rateLimitDefaultWaitSeconds: 5
  # LangGraph-backed chat assistant. Disabled by default. Enabling it requires
  # an LLM provider (chat.llm), a PostgreSQL checkpoint database
  # (chat.checkpoint) and a reachable Temporal server (seizu.temporal): every
  # turn runs as a Temporal workflow, so chat cannot admit a turn without one.
  chat:
    enabled: false
    llm:
      # "mock" is deterministic and keyless (dev only; it cannot call tools).
      # Any other value routes through LiteLLM; prefer "litellm" with a
      # provider-namespaced model (e.g. "anthropic/claude-sonnet-4-5").
      provider: mock
      # LiteLLM model identifier. Required whenever provider is not "mock" and
      # no enabled default model profile supplies one.
      model: ""
      # Optional API key via secrets.data.chatLlmApiKey, or the per-provider
      # keys (secrets.data.anthropicApiKey, openaiApiKey, ...).
      # Optional OpenAI-compatible base URL (LiteLLM api_base), e.g. a
      # self-hosted LiteLLM proxy or other gateway.
      baseUrl: ""
      temperature: 0.2
      # Per-call output token cap. 0 derives it from the model, bounded by
      # maxOutputTokensCap. Pinning this (e.g. the old 4096) starves the
      # planner on a reasoning model and collapses every plan to one step.
      maxTokens: 0
      maxOutputTokensCap: 32768
      timeoutSeconds: 60
      maxRetries: 2
      # Auto-continuation of responses truncated by the output-token limit.
      # Set maxContinuations to 0 to disable; maxResponseChars is a hard
      # ceiling on the stitched length (0 disables it).
      maxContinuations: 2
      maxResponseChars: 60000
      # Prior messages/tokens sent to the LLM per turn. Context is budgeted in
      # tokens against the model's own window (contextMaxChars is gone).
      contextMaxMessages: 80
      contextMaxTokens: 40000
      # Share of the model's input window history may occupy, the window
      # override (0 derives it from LiteLLM), the window assumed for a model
      # LiteLLM does not know, and the fraction held back when sizing a call.
      contextWindowShare: 0.5
      contextWindowTokens: 0
      contextWindowFallbackTokens: 32768
      contextSafetyMargin: 0.05
      # Explicit prompt-cache breakpoints for providers that need them.
      promptCacheEnabled: true
      promptCacheMinTokens: 1024
      # Log which part of a request changed since the previous call of the same
      # kind. A debugging aid; it token-counts every component of every call.
      cacheDiagnostics: false
      # Condense the oldest turns of a long conversation instead of dropping
      # them. compactionTarget is how far back a compaction cuts, as a fraction
      # of the history budget.
      historyCompaction: true
      historyCompactionTarget: 0.5
      historySummaryMaxTokens: 1500
      # Disclose the tools a plan step's skills declare from the start of the
      # step, while that declaration stays under the token ceiling below.
      discloseSkillTools: true
      discloseSkillToolsMaxTokens: 6000
      # Optional full system prompt override.
      systemPrompt: ""
      progressiveDisclosure: true
      # Bounds on model-requested tool/skill calls per assistant turn.
      maxAutoActions: 12
      maxParallelToolCalls: 4
      # Optional stage-specific model overrides; empty values inherit
      # llm.model (routerModel inherits plannerModel, workerSummaryModel
      # inherits workerModel). A model profile overrides these per stage.
      routerModel: ""
      plannerModel: ""
      workerModel: ""
      workerSummaryModel: ""
      verifierModel: ""
      synthesizerModel: ""
      # Used for eligible read-only work after the run's soft budget limit.
      economyModel: ""
      # How much of the output allowance a reasoning model may spend thinking:
      # "default", "none", "minimal", "low", "medium", "high", "xhigh", or
      # empty for the provider's default. Empty stage values inherit
      # reasoningEffort (workerSummary and sandbox inherit worker).
      reasoningEffort: ""
      routerReasoningEffort: none
      plannerReasoningEffort: low
      workerReasoningEffort: ""
      workerSummaryReasoningEffort: ""
      verifierReasoningEffort: ""
      sandboxReasoningEffort: ""
      synthesizerReasoningEffort: low
    # Plan -> dispatch -> verify orchestration for complex chat requests.
    orchestrator:
      enabled: true
      maxSteps: 8
      # 0 derives the planner's output ceiling from the model.
      plannerMaxTokens: 0
      maxIterations: 3
      # Steps one mapped step may expand into once its items are known.
      maxExpansion: 8
      maxParallel: 8
      # Compatibility guard for runs with every shared budget dimension off.
      workerMaxActions: 24
      workerFinalizeRetries: 2
      # Consecutive tool calls with nothing new before a step is stopped.
      stuckCallWindow: 8
      # Multiple of the planner's per-step token estimate at which a step is
      # stopped and asked to summarize, and how far past its fair share of the
      # remaining run budget a step may go before it is stopped outright.
      stepBudgetOverrun: 12.0
      stepShareHardMultiple: 3.0
      # Context budgets, in characters.
      dependencyContextMaxChars: 16000
      plannerContextMaxChars: 6000
      workerContextMaxChars: 2000
      synthesisEvidenceMaxChars: 12000
      synthesisStepMaxChars: 12000
      # Run each independent plan step of a batch as its own Temporal activity,
      # placing steps across the worker fleet. Interactive turns only.
      distributed:
        enabled: true
        minSteps: 2
        stepTimeoutSeconds: 600
        # Larger serialized step results go to the report store by reference.
        inlineMaxBytes: 262144
    # Per-turn budget shared by interactive and scheduled runs. A run is
    # budgeted in cost; the token ceiling is the backstop for a model LiteLLM
    # cannot price. A zero token or cost limit disables that dimension.
    run:
      # 0 derives it: no token ceiling when a cost budget is set and the model
      # is priced, unpricedTokenBudget when it is not.
      tokenBudget: 0
      unpricedTokenBudget: 2000000
      # Estimated provider spend one run may reach, in USD. Set 0 for a gateway
      # or custom model whose pricing LiteLLM does not know.
      costBudgetUsd: 2.0
      reservePercent: 20
      softLimitPercent: 75
      # Emergency loop guard. 0 derives it from the plan using the per-step
      # ceilings below; set both to 0 to disable the dimension.
      maxLlmCalls: 0
      llmCallsPerStep: 96
      unpricedLlmCallsPerStep: 24
      # Output tokens assumed for a call whose kind has not been seen yet, the
      # multiple of the observed average a reservation carries, and how long a
      # call waits when the run's remaining budget is reserved in flight.
      outputEstimateTokens: 4096
      outputEstimateSafety: 1.5
      contentionWaitSeconds: 30.0
    # What earlier sub-agents and earlier turns carry forward, so a step does
    # not re-derive ground already covered. Set a max-chars value to 0 to
    # disable that carry.
    memory:
      episodicRecallMaxChars: 4000
      episodicMaxEntries: 20
      sessionMaxEntries: 30
      sessionMaxReceipts: 40
      sessionDigestMaxChars: 2000
    # LangGraph checkpoint storage. PostgreSQL only in Seizu 5; a dedicated
    # database is recommended so checkpoint migrations, retention and backups
    # stay isolated from application records.
    checkpoint:
      # Empty defaults to the report store's sqlDatabaseUrl. Keep credentials
      # out of the URL and use secrets.data.chatCheckpointDatabaseUser /
      # ...Password instead.
      databaseUrl: ""
      # Create or migrate the checkpoint schema at startup.
      createTable: false
      poolMinSize: 1
      poolMaxSize: 10
    # An interactive turn runs as a Temporal workflow and is streamed from an
    # append-only event log.
    turn:
      timeoutSeconds: 900
      # How long a finished turn's event log stays replayable.
      retentionSeconds: 600
      streamLatencyMs: 200
    # Recurring headless agent runs managed from the chat UI. Reconciled into
    # Temporal Schedules by the temporal worker; there is no separate worker
    # deployment. Requires seizu.chat.enabled=true.
    schedules:
      enabled: true
      timeoutSeconds: 600
    # Retire chat sessions nobody has come back to, destroying the suspended
    # sandbox each one holds. THIS DELETES CHAT HISTORY, transcript included,
    # and the first sweep after enabling it collects everything already past
    # the threshold. Runs as a Temporal Schedule, so it needs a worker.
    sessionReap:
      enabled: false
      idleSeconds: 2592000
      intervalSeconds: 3600
    maxPersistedMessages: 200
    historyLimit: 100
    # Caps on single MCP tool-call results returned to chat.
    toolResultMaxRows: 100
    toolResultMaxBytes: 200000
  # Temporal server connection, used by the web service (turn admission and
  # workflow run visibility) and the temporal worker. Seizu 5 runs interactive
  # chat turns, scheduled chats, workflows and the session reaper on Temporal;
  # this chart does not deploy a Temporal server.
  temporal:
    address: localhost:7233
    namespace: default
    taskQueue: seizu-workflows
    # Activity slots per worker process: the cluster-wide bound on distributed
    # chat plan steps. Size it for the fleet before enabling distributed steps
    # at scale -- chat.orchestrator.maxParallel bounds one turn, this bounds
    # every turn at once.
    maxConcurrentActivities: 100
    # Cap on query result rows forwarded into a workflow.
    workflowMaxResultRows: 200
    # Allowlist of workflows the temporal action may start (e.g.
    # [cve_repo_report]). Empty -> all registered workflows.
    enabledWorkflows: []
    # Per-repository AI chat activity timeout for workflows.
    chatActivityTimeoutSeconds: 600
  # Temporal-backed configurable workflows. These are the scheduling and
  # automation interface; scheduled queries are projected into workflows.
  workflows:
    activityModules:
      - reporting.scheduled_query_modules.sqs
      - reporting.scheduled_query_modules.slack
      - reporting.scheduled_query_modules.statsd
    queryMaxRows: 200
    resultMaxBytes: 1000000
    watchPollSeconds: 20
    reconcileSeconds: 30
  # Cartography workflow orchestration settings used by the web and Temporal
  # workers. Keep enabledModules and taskQueue aligned with cartographyWorker.
  cartography:
    taskQueue: seizu-cartography
    # Empty enables every module in Seizu's Cartography 0.139.0 registry.
    enabledModules: []
    moduleTimeoutSeconds: 3600
    moduleWaitSeconds: 3600
    syncRetryAttempts: 2
  # Sandbox delegation (sandbox__delegate chat tool). Requires
  # secrets.data.sandboxApiKey when using E2B; for self-hosted sandboxes set
  # domain to the sandbox service hostname.
  sandbox:
    enabled: false
    # Hostname of the sandbox API (no scheme). Empty -> E2B's cloud endpoint.
    domain: ""
    # Allow sandboxes to make outbound internet connections.
    allowInternet: false
    # Hard timeout for a single sandbox__delegate invocation.
    timeoutSeconds: 120
    maxOutputBytes: 50000
    # Tools bound to every delegation regardless of progressive disclosure.
    # Each is still intersected with the caller's permitted tools. Set to []
    # to bind nothing up front.
    coreTools:
      - graph__query
      - graph__schema
      - graph__validate_query
      - graph__explain
    # Let the chat agent use the conversation's sandbox directly, not only
    # through sandbox__delegate.
    directToolsEnabled: true
    # Timeout for one Agent Plugin script inside the sandbox.
    scriptTimeoutSeconds: 60
    # Bytes of a sandbox file a sub-agent may pull into context. 0 replaces
    # preview_file with read_file, capped at maxOutputBytes.
    previewMaxBytes: 2000
    # Lifetime of the sandbox shared by a turn's delegations, and whether it is
    # suspended between turns (keeping full VM state, memory included) so a
    # follow-up turn reads files earlier turns wrote.
    sessionTimeoutSeconds: 1800
    sessionPersist: true
    # Also collect suspended sandboxes tagged for another deployment, or not
    # tagged at all. Only safe when these credentials are this deployment's
    # alone; see seizu.deploymentId.
    reapUntagged: false
    # Cumulative tokens one delegation may return inline before the rest is
    # written to sandbox files instead. 0 keeps only the per-call triggers.
    inlineResultBudgetTokens: 60000
    # Consecutive already-answered calls before a delegation is told to report
    # what it has.
    stuckRepeatLimit: 3
    # Caps for a sub-agent tool result written to a sandbox file.
    fileResultMaxRows: 50000
    fileResultMaxBytes: 10000000
    # LiteLLM model id for the sandbox subagent; empty inherits the worker
    # model, then chat.llm.model.
    llmModel: ""
    # Headless coding-agent CLI run inside a sandbox (used by the
    # cve_dependency_remediation workflow).
    agent:
      # "claude" (Claude Code), "codex", or "opencode".
      provider: claude
      # E2B sandbox template; empty -> the provider's official prebuilt
      # template, "none" -> the plain base image.
      template: ""
      # Command run in the worker before each agent run; its stdout becomes
      # that run's agent API key. Preferred over the static
      # secrets.data.sandboxAgentApiKey for short-lived per-run keys.
      apiKeyCommand: ""
      # Optional LLM gateway/proxy base URL exported to the agent phase.
      baseUrl: ""
      # Model override for the coding-agent CLI. Required (as
      # "provider/model") for opencode.
      model: ""
      # Run a separate ephemeral LiteLLM credential-proxy sandbox so the agent
      # sandbox only holds a budget-capped virtual key. Mutually exclusive
      # with baseUrl.
      credentialProxyEnabled: false
      # Max spend (USD) on the per-run virtual key.
      credentialProxyMaxBudget: "5"
      # Hash-locked requirement file the proxy sandbox installs when no
      # template is set; empty uses Seizu's checked-in lock. Mount your own
      # with extraVolumes/extraVolumeMounts.
      credentialProxyRequirementsFile: ""
      # E2B template for the proxy sandbox. Set -> used as built, with nothing
      # installed and nothing checked.
      credentialProxyTemplate: ""
  # CVE dependency remediation (cve_dependency_remediation workflow). Enabled
  # by configuration: it runs only when secrets.data.remediationGithubToken and
  # a sandbox-agent API key are set.
  remediation:
    # Hard timeout for one remediation run (all sandbox phases).
    timeoutSeconds: 1800
    # Post-push CI watch. maxWaitSeconds 0 disables the watch;
    # fixMaxAttempts 0 watches and records but never fixes.
    ciMaxWaitSeconds: 3600
    ciPollSeconds: 120
    ciQueuedStuckSeconds: 1800
    ciFixMaxAttempts: 1
    # gh CLI version installed in sandboxes that lack it, and an optional
    # out-of-band SHA-256 pin of its release tarball.
    ghVersion: "2.62.0"
    ghSha256: ""
    # "github.com" or a GitHub Enterprise Server hostname.
    githubHost: github.com
    # Push work branches to a bot-owned fork and open cross-repo PRs instead
    # of writing branches into the target repos.
    useFork: false
    # Organization owning the bot forks; empty -> the token user's account.
    forkOrg: ""
    # git author identity for remediation commits.
    gitUser: seizu-remediation-bot
    gitEmail: seizu-remediation@localhost

secrets:
  create: true
  existingSecret: ""
  annotations: {}
  data:
    neo4jUser: ""
    neo4jPassword: ""
    oidcClientSecret: ""
    reportQuerySigningSecret: ""
    sessionTokenEncryptionKey: ""
    # Credentials overlaid on seizu.reportStore.sqlDatabaseUrl.
    sqlDatabaseUser: ""
    sqlDatabasePassword: ""
    # Credentials for seizu.chat.checkpoint.databaseUrl; empty values inherit
    # the SQL credentials above.
    chatCheckpointDatabaseUser: ""
    chatCheckpointDatabasePassword: ""
    # API key override passed to LiteLLM for the chat assistant. If empty, the
    # per-provider keys below apply.
    chatLlmApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    geminiApiKey: ""
    googleApiKey: ""
    deepseekApiKey: ""
    # API key for the sandbox service (required for E2B).
    sandboxApiKey: ""
    # Static API key for the sandbox coding agent; prefer
    # seizu.sandbox.agent.apiKeyCommand for short-lived per-run keys.
    sandboxAgentApiKey: ""
    # GitHub token for the remediation workflow's setup/push phases and CI
    # watch. Configured = the workflow is enabled.
    remediationGithubToken: ""
    # Comma-separated k=v pairs authenticating to the OTLP collector.
    telemetryOtlpHeaders: ""
  # Arbitrary additional keys written into the same Secret, verbatim. Use for
  # credentials the chart has no named field for -- the token_env variables
  # named by seizu.mcp.external.proxies, scheduled-query action module
  # credentials, cloud SDK keys.
  extraData: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: seizu.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# Temporal worker hosting Seizu's workflow and activity code. In Seizu 5 it
# owns interactive chat turns, distributed plan steps, scheduled chats,
# configurable workflows and the chat session reaper, so enable it for
# anything beyond a read-only web deployment. Requires a reachable Temporal
# server (seizu.temporal.address); this chart does not deploy Temporal.
temporalWorker:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - reporting.temporal_worker
  resources: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []

# Dedicated Cartography 0.139.0 Temporal activity worker. The image contains
# Cartography and the thin Seizu worker only; it intentionally does not receive
# the main Seizu Secret. Enable temporalWorker as well unless another
# deployment is already serving the Seizu workflow task queue.
cartographyWorker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/mappedsky/seizu-cartography
    pullPolicy: IfNotPresent
    # Empty follows Chart.appVersion (5.2.0).
    tag: ""
  # Empty uses the image's default: python -m cartography_sync.worker.
  command: []
  # Empty inherits seizu.neo4j.uri.
  neo4jUri: ""
  # Non-secret worker and upstream SDK configuration. Empty values are omitted.
  # File paths must be supplied through extraVolumes/extraVolumeMounts.
  config:
    LOG_LEVEL: INFO
    CARTOGRAPHY_BIN: cartography
    CARTOGRAPHY_STATSD_ENABLED: "false"
    CARTOGRAPHY_STATSD_HOST: ""
    CARTOGRAPHY_AWS_PROFILE: ""
    CARTOGRAPHY_AWS_REGION: ""
    CARTOGRAPHY_AWS_DEFAULT_REGION: ""
    CARTOGRAPHY_AWS_CONFIG_FILE: ""
    CARTOGRAPHY_AWS_SHARED_CREDENTIALS_FILE: ""
    CARTOGRAPHY_AWS_EC2_METADATA_SERVICE_ENDPOINT: ""
    CARTOGRAPHY_AWS_ROLE_ARN: ""
    CARTOGRAPHY_AWS_WEB_IDENTITY_TOKEN_FILE: ""
    CARTOGRAPHY_GOOGLE_APPLICATION_CREDENTIALS: ""
    CARTOGRAPHY_GOOGLE_CLOUD_PROJECT: ""
    CARTOGRAPHY_CLOUDSDK_CONFIG: ""
    CARTOGRAPHY_OCI_CONFIG_FILE: ""
    CARTOGRAPHY_OCI_CONFIG_PROFILE: ""
    CARTOGRAPHY_OCI_CLI_AUTH: ""
    CARTOGRAPHY_OCI_CLI_REGION: ""
  # Cartography credentials use their exact v4.0.0 environment-variable names
  # to make upgrades auditable. Only non-empty values are written.
  secrets:
    create: true
    existingSecret: ""
    annotations: {}
    data:
      CARTOGRAPHY_NEO4J_USER: ""
      CARTOGRAPHY_NEO4J_PASSWORD: ""
      CARTOGRAPHY_GITHUB_CONFIG: ""
      # Deprecated compatibility alias; it must contain the same base64 JSON
      # config as CARTOGRAPHY_GITHUB_CONFIG, never a bare token.
