replicaCount: 1

image:
  repository: ghcr.io/mappedsky/seizu
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

seizu:
  debug: false
  host: 0.0.0.0
  port: 8080
  staticFolder: ""
  logConfigFile: ""
  talismanForceHttps: true
  apiRequestTimeout: 60
  jwksFetchTimeout: 10
  awsConnectTimeout: 5
  awsReadTimeout: 30
  sqlStatementTimeout: 30
  slackTimeout: 30
  # Public browser origin used when MCP clients need to show a user an approval
  # URL. When unset, Seizu derives the origin from seizu.mcp.resourceUrl.
  publicUrl: ""
  # Maximum lifetime for an approved or denied mutating-action confirmation.
  actionConfirmationTtlSeconds: 1800
  auth:
    developmentOnlyRequireAuth: false
    developmentOnlyAuthUserEmail: testuser
    jwksUrl: ""
    allowedJwtAlgorithms:
      - RS256
      - ES256
      - ES512
    jwtHeaderName: Authorization
    jwtEmailClaim: email
    jwtUsernameClaim: preferred_username
    jwtSubClaim: sub
    jwtIssClaim: iss
    jwtIssuer: ""
    jwtAudience: ""
    oidcAuthority: ""
    oidcInternalAuthority: ""
    oidcClientId: ""
    oidcTokenEndpointAuthMethod: none
    # Empty values inherit oidcTokenEndpointAuthMethod.
    oidcRevocationEndpointAuthMethod: ""
    oidcIntrospectionEndpointAuthMethod: ""
    oidcDiscoveryCacheTtlSeconds: 3600
    oidcRedirectUri: ""
    oidcScope: openid email offline_access
    oidcAuthorizeExtraParams: ""
    oidcEnableTokenIntrospection: false
    oidcValidateIdToken: true
    sessionCookieName: seizu_session
    sessionCookieMaxAgeSeconds: 64800
    oidcRevokeRefreshTokenOnLogout: true
    oidcRefreshTokenFallbackTtlSeconds: "2592000"
  neo4j:
    uri: bolt://neo4j:7687
    notificationsMinSeverity: WARNING
    maxConnectionLifetime: 3600
    connectionTimeout: 10
    queryTimeout: 30
  queryValidator:
    allowedProcedures: []
  reportStore:
    backend: dynamodb
    # Unique 0-1023 value per replica when multiple instances may generate IDs.
    snowflakeMachineId: 1
    dynamodb:
      tableName: seizu-reports
      region: us-east-1
      endpointUrl: ""
      createTable: false
    # Keep credentials out of this URL and provide them through
    # secrets.data.sqlDatabaseUser / secrets.data.sqlDatabasePassword.
    sqlDatabaseUrl: ""
  rbac:
    roleClaim: seizu_role
    defaultRole: seizu-viewer
  statsd:
    host: ""
    port: 8125
    constantTags: []
  mcp:
    enabled: true
    enabledBuiltins: []
    oauthIssuer: ""
    oauthAuthorizationEndpoint: ""
    oauthTokenEndpoint: ""
    resourceUrl: ""
    oauthRegistrationEndpoint: ""
  # LangGraph-backed chat assistant. Disabled by default; enabling it requires
  # an LLM provider (chat.llm) and checkpoint storage (chat.checkpoint).
  chat:
    enabled: false
    llm:
      # "mock" is deterministic and keyless (dev only; it cannot call tools).
      # Any other value routes through LiteLLM; prefer "litellm" with a
      # provider-namespaced model (e.g. "anthropic/claude-sonnet-4-5").
      provider: mock
      # LiteLLM model identifier. Required whenever provider is not "mock".
      model: ""
      # Optional API key via secrets.data.chatLlmApiKey, or the per-provider
      # keys (secrets.data.anthropicApiKey, openaiApiKey, ...).
      # Optional OpenAI-compatible base URL (LiteLLM api_base), e.g. a
      # self-hosted LiteLLM proxy or other gateway.
      baseUrl: ""
      temperature: 0.2
      maxTokens: 4096
      timeoutSeconds: 60
      maxRetries: 2
      # Auto-continuation of responses truncated by the output-token limit.
      # Set maxContinuations to 0 to disable; maxResponseChars is a hard
      # ceiling on the stitched length (0 disables it).
      maxContinuations: 2
      maxResponseChars: 60000
      # Prior messages/characters sent to the LLM per turn.
      contextMaxMessages: 80
      contextMaxChars: 120000
      # Optional full system prompt override.
      systemPrompt: ""
      progressiveDisclosure: true
      # Bounds on model-requested tool/skill calls per assistant turn.
      maxAutoActions: 12
      maxParallelToolCalls: 4
      # Optional role-specific model overrides; empty values inherit llm.model.
      plannerModel: ""
      workerModel: ""
      verifierModel: ""
      synthesizerModel: ""
      # Used for eligible read-only work after the run's soft budget limit.
      economyModel: ""
    # Plan -> dispatch -> verify orchestration for complex chat requests.
    orchestrator:
      enabled: true
      maxSteps: 8
      plannerMaxTokens: 4096
      maxIterations: 3
      maxParallel: 3
      workerMaxActions: 24
    # Per-turn budget shared by interactive and scheduled runs. A zero token
    # or cost limit disables that dimension.
    run:
      tokenBudget: 120000
      costBudgetUsd: 0
      reservePercent: 20
      softLimitPercent: 75
      maxLlmCalls: 64
    # LangGraph checkpoint storage: "dynamodb" (default) or "postgres".
    checkpoint:
      backend: dynamodb
      # PostgreSQL URL used when backend=postgres; defaults to the report
      # store's sqlDatabaseUrl when empty. Keep credentials out of the URL and
      # use secrets.data.chatCheckpointDatabaseUser / ...Password instead.
      databaseUrl: ""
      poolMinSize: 1
      poolMaxSize: 10
      # DynamoDB-only settings.
      tableName: seizu-chat-checkpoints
      createTable: false
      ttlSeconds: 0
      enableCompression: true
      # S3 offload for checkpoint payloads larger than 350KB.
      s3Bucket: ""
      s3EndpointUrl: ""
      s3KeyPrefix: seizu/langgraph
    maxPersistedMessages: 200
    historyLimit: 100
    # Caps on single MCP tool-call results returned to chat.
    toolResultMaxRows: 100
    toolResultMaxBytes: 200000
  # Temporal server connection, used by the web service (workflow run
  # visibility), the scheduled-query temporal action, and the temporal worker.
  temporal:
    address: localhost:7233
    namespace: default
    taskQueue: seizu-workflows
    # Cap on scheduled-query result rows forwarded into a workflow.
    workflowMaxResultRows: 200
    # Allowlist of workflows the temporal scheduled-query action may start
    # (e.g. [cve_repo_report]). Empty -> all registered workflows.
    enabledWorkflows: []
    # Per-repository AI chat activity timeout for workflows.
    chatActivityTimeoutSeconds: 600
  # Temporal-backed configurable workflows. In Seizu 4, these replace
  # scheduled queries as the primary scheduling and automation interface.
  workflows:
    activityModules:
      - reporting.scheduled_query_modules.sqs
      - reporting.scheduled_query_modules.slack
      - reporting.scheduled_query_modules.statsd
    queryMaxRows: 200
    resultMaxBytes: "1000000"
    watchPollSeconds: 20
    reconcileSeconds: 30
  # Cartography workflow orchestration settings used by the web and Temporal
  # workers. Keep enabledModules and taskQueue aligned with cartographyWorker.
  cartography:
    taskQueue: seizu-cartography
    # Empty enables every module in Seizu's Cartography 0.139.0 registry.
    enabledModules: []
    moduleTimeoutSeconds: 3600
    moduleWaitSeconds: 3600
    syncRetryAttempts: 2
  # Sandbox delegation (sandbox__delegate chat tool). Requires
  # secrets.data.sandboxApiKey when using E2B; for self-hosted sandboxes set
  # domain to the sandbox service hostname.
  sandbox:
    enabled: false
    # Hostname of the sandbox API (no scheme). Empty -> E2B's cloud endpoint.
    domain: ""
    # Allow sandboxes to make outbound internet connections.
    allowInternet: false
    # Hard timeout for a single sandbox__delegate invocation.
    timeoutSeconds: 120
    maxOutputBytes: 50000
    # LiteLLM model id for the sandbox subagent; empty inherits chat.llm.model.
    llmModel: ""
    # Headless coding-agent CLI run inside a sandbox (used by the
    # cve_dependency_remediation workflow).
    agent:
      # "claude" (Claude Code), "codex", or "opencode".
      provider: claude
      # E2B sandbox template; empty -> the provider's official prebuilt
      # template, "none" -> the plain base image.
      template: ""
      # Command run in the worker before each agent run; its stdout becomes
      # that run's agent API key. Preferred over the static
      # secrets.data.sandboxAgentApiKey for short-lived per-run keys.
      apiKeyCommand: ""
      # Optional LLM gateway/proxy base URL exported to the agent phase.
      baseUrl: ""
      # Model override for the coding-agent CLI. Required (as
      # "provider/model") for opencode.
      model: ""
      # Run a separate ephemeral LiteLLM credential-proxy sandbox so the agent
      # sandbox only holds a budget-capped virtual key. Mutually exclusive
      # with baseUrl.
      credentialProxyEnabled: false
      # Max spend (USD) on the per-run virtual key.
      credentialProxyMaxBudget: "5"
  # CVE dependency remediation (cve_dependency_remediation workflow). Enabled
  # by configuration: it runs only when secrets.data.remediationGithubToken and
  # a sandbox-agent API key are set.
  remediation:
    # Hard timeout for one remediation run (all sandbox phases).
    timeoutSeconds: 1800
    # Post-push CI watch. maxWaitSeconds 0 disables the watch;
    # fixMaxAttempts 0 watches and records but never fixes.
    ciMaxWaitSeconds: 3600
    ciPollSeconds: 120
    ciQueuedStuckSeconds: 1800
    ciFixMaxAttempts: 1
    # gh CLI version installed in sandboxes that lack it, and an optional
    # out-of-band SHA-256 pin of its release tarball.
    ghVersion: "2.62.0"
    ghSha256: ""
    # "github.com" or a GitHub Enterprise Server hostname.
    githubHost: github.com
    # Push work branches to a bot-owned fork and open cross-repo PRs instead
    # of writing branches into the target repos.
    useFork: false
    # Organization owning the bot forks; empty -> the token user's account.
    forkOrg: ""
    # git author identity for remediation commits.
    gitUser: seizu-remediation-bot
    gitEmail: seizu-remediation@localhost

secrets:
  create: true
  existingSecret: ""
  annotations: {}
  data:
    neo4jUser: ""
    neo4jPassword: ""
    oidcClientSecret: ""
    reportQuerySigningSecret: ""
    sessionTokenEncryptionKey: ""
    # Credentials overlaid on seizu.reportStore.sqlDatabaseUrl.
    sqlDatabaseUser: ""
    sqlDatabasePassword: ""
    # Credentials for seizu.chat.checkpoint.databaseUrl; empty values inherit
    # the SQL credentials above.
    chatCheckpointDatabaseUser: ""
    chatCheckpointDatabasePassword: ""
    # API key override passed to LiteLLM for the chat assistant. If empty, the
    # per-provider keys below apply.
    chatLlmApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    geminiApiKey: ""
    googleApiKey: ""
    deepseekApiKey: ""
    # API key for the sandbox service (required for E2B).
    sandboxApiKey: ""
    # Static API key for the sandbox coding agent; prefer
    # seizu.sandbox.agent.apiKeyCommand for short-lived per-run keys.
    sandboxAgentApiKey: ""
    # GitHub token for the remediation workflow's setup/push phases and CI
    # watch. Configured = the workflow is enabled.
    remediationGithubToken: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: seizu.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

scheduledQueries:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - reporting.scheduled_queries
  frequency: 20
  resources: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []

# Scheduled chats worker (recurring headless agent runs managed from the chat
# UI). Enabling it also enables the API routes and the frontend UI. Requires
# seizu.chat.enabled=true.
scheduledChats:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - reporting.scheduled_chats
  # How often the worker polls for due schedules.
  pollSeconds: 20
  # Timeout for one scheduled headless agent session.
  timeoutSeconds: 600
  resources: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []

# Temporal worker hosting Seizu's workflow and activity code (used by the
# temporal scheduled-query action). Requires a reachable Temporal server
# (seizu.temporal.address); this chart does not deploy Temporal.
temporalWorker:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - reporting.temporal_worker
  resources: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []

# Dedicated Cartography 0.139.0 Temporal activity worker. The image contains
# Cartography and the thin Seizu worker only; it intentionally does not receive
# the main Seizu Secret. Enable temporalWorker as well unless another
# deployment is already serving the Seizu workflow task queue.
cartographyWorker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/mappedsky/seizu-cartography
    pullPolicy: IfNotPresent
    # Empty follows Chart.appVersion (4.1.0).
    tag: ""
  # Empty uses the image's default: python -m cartography_sync.worker.
  command: []
  # Empty inherits seizu.neo4j.uri.
  neo4jUri: ""
  # Non-secret worker and upstream SDK configuration. Empty values are omitted.
  # File paths must be supplied through extraVolumes/extraVolumeMounts.
  config:
    LOG_LEVEL: INFO
    CARTOGRAPHY_BIN: cartography
    CARTOGRAPHY_STATSD_ENABLED: "false"
    CARTOGRAPHY_STATSD_HOST: ""
    CARTOGRAPHY_AWS_PROFILE: ""
    CARTOGRAPHY_AWS_REGION: ""
    CARTOGRAPHY_AWS_DEFAULT_REGION: ""
    CARTOGRAPHY_AWS_CONFIG_FILE: ""
    CARTOGRAPHY_AWS_SHARED_CREDENTIALS_FILE: ""
    CARTOGRAPHY_AWS_EC2_METADATA_SERVICE_ENDPOINT: ""
    CARTOGRAPHY_AWS_ROLE_ARN: ""
    CARTOGRAPHY_AWS_WEB_IDENTITY_TOKEN_FILE: ""
    CARTOGRAPHY_GOOGLE_APPLICATION_CREDENTIALS: ""
    CARTOGRAPHY_GOOGLE_CLOUD_PROJECT: ""
    CARTOGRAPHY_CLOUDSDK_CONFIG: ""
    CARTOGRAPHY_OCI_CONFIG_FILE: ""
    CARTOGRAPHY_OCI_CONFIG_PROFILE: ""
    CARTOGRAPHY_OCI_CLI_AUTH: ""
    CARTOGRAPHY_OCI_CLI_REGION: ""
  # Cartography credentials use their exact v4.0.0 environment-variable names
  # to make upgrades auditable. Only non-empty values are written.
  secrets:
    create: true
    existingSecret: ""
    annotations: {}
    data:
      CARTOGRAPHY_NEO4J_USER: ""
      CARTOGRAPHY_NEO4J_PASSWORD: ""
      CARTOGRAPHY_GITHUB_CONFIG: ""
      # Deprecated compatibility alias; it must contain the same base64 JSON
      # config as CARTOGRAPHY_GITHUB_CONFIG, never a bare token.
      CARTOGRAPHY_GITHUB_TOKEN: ""
      CARTOGRAPHY_AWS_ACCESS_KEY_ID: ""
      CARTOGRAPHY_AWS_SECRET_ACCESS_KEY: ""
      CARTOGRAPHY_AWS_SESSION_TOKEN: ""
      CARTOGRAPHY_AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
      CARTOGRAPHY_AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
      CARTOGRAPHY_AIRBYTE_CLIENT_SECRET: ""
      CARTOGRAPHY_ANTHROPIC_API_KEY: ""
      CARTOGRAPHY_AZURE_CLIENT_SECRET: ""
      CARTOGRAPHY_MICROSOFT_CLIENT_SECRET: ""
      CARTOGRAPHY_CLOUDFLARE_TOKEN: ""
      CARTOGRAPHY_NIST_NVD_TOKEN: ""
      CARTOGRAPHY_CROWDSTRIKE_CLIENT_ID: ""
      CARTOGRAPHY_CROWDSTRIKE_CLIENT_SECRET: ""
      CARTOGRAPHY_DATABRICKS_TOKEN: ""
      CARTOGRAPHY_DATABRICKS_CLIENT_SECRET: ""
      CARTOGRAPHY_DATABRICKS_ACCOUNT_CLIENT_SECRET: ""
      CARTOGRAPHY_DIGITALOCEAN_TOKEN: ""
      CARTOGRAPHY_GITLAB_TOKEN: ""
      CARTOGRAPHY_GOOGLEWORKSPACE_GOOGLE_APPLICATION_CREDENTIALS: ""
      CARTOGRAPHY_GSUITE_GOOGLE_APPLICATION_CREDENTIALS: ""
      CARTOGRAPHY_JAMF_PASSWORD: ""
      CARTOGRAPHY_JUMPCLOUD_API_KEY: ""
      CARTOGRAPHY_KANDJI_TOKEN: ""
      CARTOGRAPHY_KEYCLOAK_CLIENT_SECRET: ""
      CARTOGRAPHY_LASTPASS_CID: ""
      CARTOGRAPHY_LASTPASS_PROVHASH: ""
      CARTOGRAPHY_BIGFIX_PASSWORD: ""
      CARTOGRAPHY_DUO_API_KEY: ""
      CARTOGRAPHY_DUO_API_SECRET: ""
      CARTOGRAPHY_WORKDAY_API_PASSWORD: ""
      CARTOGRAPHY_OPENAI_API_KEY: ""
      CARTOGRAPHY_PAGERDUTY_API_KEY: ""
      CARTOGRAPHY_OKTA_API_KEY: ""
      CARTOGRAPHY_SALESFORCE_CLIENT_SECRET: ""
      CARTOGRAPHY_SALESFORCE_PRIVATE_KEY: ""
      CARTOGRAPHY_SCALEWAY_SECRET_KEY: ""
      CARTOGRAPHY_SEMGREP_APP_TOKEN: ""
      CARTOGRAPHY_SENTRY_TOKEN: ""
      CARTOGRAPHY_SENTINELONE_API_TOKEN: ""
      CARTOGRAPHY_SLACK_TOKEN: ""
      CARTOGRAPHY_SNIPEIT_TOKEN: ""
      CARTOGRAPHY_SOCKETDEV_TOKEN: ""
      CARTOGRAPHY_SPACELIFT_API_TOKEN: ""
      CARTOGRAPHY_SPACELIFT_API_KEY_ID: ""
      CARTOGRAPHY_SPACELIFT_API_KEY_SECRET: ""
      CARTOGRAPHY_SUBIMAGE_CLIENT_ID: ""
      CARTOGRAPHY_SUBIMAGE_CLIENT_SECRET: ""
      CARTOGRAPHY_TAILSCALE_TOKEN: ""
      CARTOGRAPHY_TAILSCALE_OAUTH_CLIENT_ID: ""
      CARTOGRAPHY_TAILSCALE_OAUTH_CLIENT_SECRET: ""
      CARTOGRAPHY_TENABLE_ACCESS_KEY: ""
      CARTOGRAPHY_TENABLE_SECRET_KEY: ""
      CARTOGRAPHY_VERCEL_TOKEN: ""
      CARTOGRAPHY_CIRCLECI_TOKEN: ""
      CARTOGRAPHY_WORKOS_API_KEY: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  resources: {}
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

runtimeDir:
  enabled: true
  mountPath: /run/seizu
  medium: Memory
  sizeLimit: ""

extraEnv: []
extraEnvFrom: []
extraVolumeMounts: []
extraVolumes: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
