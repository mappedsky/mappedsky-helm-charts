name: Publish Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
    tags:
      # Per-chart release tags, e.g. seizu-v0.1.0
      - "*-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Charts are pushed to oci://ghcr.io/<owner>/charts/<chart-name>
  OCI_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Package and push charts
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Package a single chart directory and push it, skipping versions
          # that are already published so reruns are idempotent.
          publish_chart() {
            local chart_dir="$1"
            local name version
            name="$(helm show chart "$chart_dir" | yq -r '.name')"
            version="$(helm show chart "$chart_dir" | yq -r '.version')"

            if helm show chart "oci://${OCI_REPOSITORY}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "Skipping ${name} ${version}: already published."
              return 0
            fi

            echo "Publishing ${name} ${version}..."
            helm dependency build "$chart_dir"
            helm package "$chart_dir" --destination .helm-packages
            helm push ".helm-packages/${name}-${version}.tgz" "oci://${OCI_REPOSITORY}"
          }

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Tag-driven release: tag is <chart>-v<version>, e.g. seizu-v0.1.0
            tag="$GITHUB_REF_NAME"
            chart_name="${tag%-v*}"
            tag_version="${tag##*-v}"
            chart_dir="charts/${chart_name}/"

            if [ ! -f "${chart_dir}Chart.yaml" ]; then
              echo "::error::Tag '${tag}' does not map to a chart at ${chart_dir}" >&2
              exit 1
            fi

            chart_version="$(helm show chart "$chart_dir" | yq -r '.version')"
            if [ "$chart_version" != "$tag_version" ]; then
              echo "::error::Tag version '${tag_version}' does not match ${chart_dir}Chart.yaml version '${chart_version}'" >&2
              exit 1
            fi

            publish_chart "$chart_dir"
            echo "Published ${chart_name} ${tag_version} from tag."
          else
            # Branch push / manual run: publish any chart whose version is new.
            published=0
            for chart_dir in charts/*/; do
              [ -f "${chart_dir}Chart.yaml" ] || continue
              publish_chart "$chart_dir"
              published=$((published + 1))
            done
            echo "Processed ${published} chart(s)."
          fi
